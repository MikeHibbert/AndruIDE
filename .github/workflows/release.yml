# Builds a release for every platform when a version tag (v1.2.3) is pushed, and
# puts it in a draft GitHub release to look over and publish. scripts/release.sh
# makes the tag. Run by hand (Actions › release › Run workflow), it builds the
# same files without a release, to try the pipeline.
#
# Signed and notarized when the signing secrets are set (see RELEASING.md);
# without them the macOS app is an unsigned test build.
#
 # The signing secrets belong in the release environment, which only the jobs
 # that sign use (macos, disabled today). Such a job skips rust-cache and Zig's
 # build cache: a poisoned cache could run code next to the unlocked keychain.
#
# Actions are pinned to commits, with the version in a comment. rust-toolchain
# is pinned to a master commit, as its README asks, and told to use stable.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read only. The release job, which makes the draft, gets write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Set when the Developer ID certificate is a secret: then sign and notarize.
  # Only the release environment's jobs see the secrets: elsewhere it's false.
  SIGNED: ${{ secrets.MACOS_CERT_P12 != '' }}

jobs:
  # The agent for every platform we ship: the app uploads the right one to each
  # machine when it connects. Windows and Linux only for now (Father's
  # directive, 11 Nov 2026): the agents job used to build on macOS, but mac
  # hosted runners have been capacity-starved three dispatches in a row
  # (43063214910, 43085613467, 43088155073 - the job waits on runners and is
  # cancelled, cascading to every job that needs its artifact). Cross-built
  # from Ubuntu instead; build-agents.sh skips its Darwin branch there, so no
  # macOS agents until the macos job comes back.
  agents:
    runs-on: ubuntu-22.04
    # The signing secrets belong in this environment. No rust-cache: see the top.
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu,aarch64-pc-windows-gnullvm
      # Without Zig's build cache. setup-zig still restores the Zig download
      # itself from the Actions cache, and doesn't check its signature then.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild
      # No signing on Ubuntu: that was for the macOS agents, which return
      # with the macos job.
      - run: scripts/build-agents.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agents
          path: dist/agents
          if-no-files-found: error

  macos:
    needs: agents
    # Disabled for now (Father, 11 Nov 2026): windows and linux only. The mac
    # hosted runners this job (and the agents job before its move to Ubuntu)
    # needed have been capacity-starved three runs in a row. Keep the job for
    # when macOS DMGs are wanted again: delete this `if: false` to re-enable.
    if: false
    runs-on: macos-15
    # The signing secrets belong in this environment. No rust-cache: see the top.
    environment: release
    # Whether it signed, for the release job: that job can't see the secrets.
    outputs:
      signed: ${{ env.SIGNED }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agents
          path: dist/agents
      - run: chmod +x dist/agents/*
      - name: Signing identity
        if: env.SIGNED == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: scripts/ci/macos-keychain.sh
      - name: Build, sign and notarize
        if: env.SIGNED == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          scripts/bundle-macos.sh --release --skip-agents
          scripts/notarize-macos.sh
      - name: Build (unsigned test build)
        if: env.SIGNED != 'true'
        run: |
          scripts/bundle-macos.sh --universal --skip-agents
          scripts/notarize-macos.sh --no-notarize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/AndruIDE-*-macos.dmg
          if-no-files-found: error

  # Intel and Arm, each built on its own kind of machine. The oldest Ubuntu
  # GitHub runs: the app needs this glibc (2.35) or newer.
  linux:
    needs: agents
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: GPUI's libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libx11-xcb-dev libxcb1-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agents
          path: dist/agents
      - run: chmod +x dist/agents/*
      - run: scripts/package-linux.sh --skip-agents
      - run: scripts/linux-packages.sh
      - name: It runs here
        run: |
          tar -xzf dist/AndruIDE-*-linux-${{ matrix.arch }}.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/AndruIDE/andruide" --version
          "$RUNNER_TEMP/AndruIDE/agents/andruide-agent-linux-${{ matrix.arch }}" hash
          dist/AndruIDE-*-linux-${{ matrix.arch }}.AppImage --appimage-extract-and-run --version
      # Each package installs with its dependencies on a fresh system, and runs.
      - name: The .deb on Ubuntu
        run: |
          sudo apt-get install -y -qq ./dist/AndruIDE-*-linux-${{ matrix.arch }}.deb
          andruide --version && andruide --version
          sudo apt-get remove -y -qq andruide
      - name: The .rpm on Fedora
        run: docker run --rm -v "$PWD/dist:/d" fedora:latest sh -c 'dnf install -y -q /d/AndruIDE-*-linux-${{ matrix.arch }}.rpm && andruide --version'
      - name: The Arch package
        if: matrix.arch == 'x86_64'
        run: docker run --rm -v "$PWD/dist:/d" archlinux:latest sh -c 'sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf && pacman -Sy --noconfirm >/dev/null && pacman -U --noconfirm /d/AndruIDE-*-linux-x86_64.pkg.tar.zst && andruide --version'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/AndruIDE-*-linux-${{ matrix.arch }}.tar.gz
            dist/AndruIDE-*-linux-${{ matrix.arch }}.deb
            dist/AndruIDE-*-linux-${{ matrix.arch }}.rpm
            dist/AndruIDE-*-linux-${{ matrix.arch }}.pkg.tar.zst
            dist/AndruIDE-*-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  # x64 and Arm, each built on its own kind of machine.
  windows:
    needs: agents
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            agent: x86_64
            runner: windows-2022
          - arch: arm64
            agent: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agents
          path: dist/agents
      - name: Inno Setup, for the installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install innosetup --no-progress -y
            } else {
              # From its maker, where there's no Chocolatey.
              Invoke-WebRequest https://jrsoftware.org/download.php/is.exe -OutFile "$env:RUNNER_TEMP\innosetup.exe"
              Start-Process "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
            }
          }
      - run: scripts/package-windows.ps1
        shell: pwsh
      - name: It runs here
        shell: pwsh
        run: |
          dist\windows\AndruIDE\andruide.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dist\windows\AndruIDE\agents\andruide-agent-windows-${{ matrix.agent }}.exe hash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/AndruIDE-*-windows-${{ matrix.arch }}.zip
            dist/AndruIDE-*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  # A draft release with every file and their checksums, for a tag.
  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The one job that writes: gh release create.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # The macos job is disabled (windows + linux only for now), so only
          # its artifacts go into the release.
          pattern: '{linux-*,windows-*}'
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum AndruIDE-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/AndruIDE-* dist/SHA256SUMS.txt \
            --draft --title "AndruIDE ${GITHUB_REF_NAME#v}" --generate-notes
